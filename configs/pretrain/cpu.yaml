inherit: [stage1.yaml]

data:
  catalog: synthetic
  group_weights: null
  windows: 400
  distinct_windows: 2
  mirror_probability: 0.0
  workers: 0

encoder:
  video_model: vit_small_patch16_dinov3.lvd1689m
  video_feature_dimension: 384
  video_layers: [3, 6, 9, 12]
  image_size: 112
  audio_model: mispeech/dasheng-base
  context_frames: 4
  total_frames: 12

model:
  backbone: {hidden_dimension: 128, heads: 4, layers: 2}
  diffusion_head: {hidden_dimension: 256, heads: 4, layers: 1}
  spatial_grid: [7, 7]
  attention_backend: sdpa

optimizer:
  learning_rate: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 10

trainer:
  output: outputs/cpu
  epochs: 1
  batch_size: 2
  gradient_accumulation: 1
  precision: fp32
  device: cpu
  ema_decay: 0.99
  normalizer_windows: 2
  log_every: 10
  checkpoint_steps: 100
  snapshot_steps: 0
  max_steps: 200
  wandb_mode: disabled
