inherit: [mvp.yaml]

data:
  synthetic: true
  latent_cache: outputs/cpu_cache
  validation_clips: 4
  clips: 400
  mirror_probability: 0.0
  workers: 0

encoder:
  video: {kind: dinov3, model_id: vit_small_patch16_dinov3.lvd1689m, feature_dimension: 384, layers: [3, 6, 9, 12]}
  image_size: 112
  context_frames: 4
  total_frames: 12

model:
  backbone: {hidden_dimension: 128, heads: 4, layers: 2}
  diffusion_head: {hidden_dimension: 256, heads: 4, layers: 1}
  spatial_grid: [7, 7]
  attention_backend: sdpa

optimizer:
  learning_rate: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 10

trainer:
  output: outputs/cpu
  epochs: 1
  batch_size: 2
  gradient_accumulation: 1
  precision: fp32
  device: cpu
  ema_decay: 0.99
  normalizer_clips: 2
  log_every: 10
  checkpoint_steps: 100
  max_steps: 200
  wandb_mode: disabled
