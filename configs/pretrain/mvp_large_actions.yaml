inherit: [mvp_large.yaml]

data:
  latent_cache: ${oc.env:SPEAKUP_LATENTS}/mvp_actions
  recorded_actions: true

encoder:
  context_frames: 36
  total_frames: 64

objective:
  action_dropout: 0.1
  audio_step_pooling: true
  spatial_audio_target: false

trainer:
  output: ${oc.env:SPEAKUP_RUNS}/mvp_large_actions
  batch_size: 8
  gradient_accumulation: 8
