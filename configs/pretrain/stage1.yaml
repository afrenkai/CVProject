inherit: [../data/stage1_mix.yaml]

data:
  windows: 400000
  validation_windows: 256
  mirror_probability: 0.5
  workers: 10

encoder:
  video_model: vit_large_patch16_dinov3.lvd1689m
  video_feature_dimension: 1024
  video_layers: [6, 12, 18, 24]
  image_size: 256
  audio_model: mispeech/dasheng-1.2B
  video_rate: 10
  video_frames_per_step: 1
  context_frames: 12
  total_frames: 40
  spatial_audio: true

model:
  backbone: {hidden_dimension: 1024, heads: 16, layers: 12}
  diffusion_head: {hidden_dimension: 2048, heads: 16, layers: 2}
  mlp_ratio: 2.0
  spatial_grid: [16, 16]
  noise_time_embedding: gaussian_fourier
  prediction: data
  attention_backend: flex_flash

objective:
  video_target: change
  context_noise: 0.2

optimizer:
  name: muon
  learning_rate: 2.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  schedule: cosine
  final_learning_rate_fraction: 0.0

trainer:
  output: ${oc.env:SPEAKUP_RUNS}/stage1_v3
  epochs: 6
  batch_size: 12
  gradient_accumulation: 3
  precision: bf16
  activation_checkpointing: true
  ema_decay: 0.999
  eval_steps: 500
  checkpoint_steps: 250
  snapshot_steps: 1000
  wandb_project: Speakup
  wandb_mode: online
  compile: true
