defaults:
  - hydra_defaults
  - data: staged_corpus
  - backbones@encoder: frozen_av
  - _self_

_target_: training.pretraining.normalization_types.NormalizationConfig
_convert_: all
windows: /path/to/train/windows.yaml
output: /path/to/output
sample_windows: 1024
workers: 2
seed: 67
minimum_standard_deviation: 0.000001
prefix_checks:
  absolute_tolerance: 0.000001
  relative_tolerance: 0.000001
